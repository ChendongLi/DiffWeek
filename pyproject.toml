[tool.poetry]
name = "diffweek"
version = "0.1.0"
description = "Weekly engineering summary generator with git stats and PR metadata"
readme = "README.md"
packages = [{include = "diffweek"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.0"
typer = "^0.15.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.0.0"

[tool.poetry.scripts]
diffweek = "diffweek.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
